services:
  server:
    image: judge0/judge0:latest
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - shared-tmp:/tmp
      - shared-isolate:/var/local/lib/isolate
    ports:
      - "2358:2358"
    privileged: true
    restart: always
    env_file: judge0.conf
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  workers:
    image: judge0/judge0:latest
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - shared-tmp:/tmp
      - shared-isolate:/var/local/lib/isolate
    privileged: true
    restart: always
    env_file: judge0.conf
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:13.0
    env_file: judge0.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.0
    command: ["sh", "-c", "docker-entrypoint.sh --requirepass $$REDIS_PASSWORD"]
    env_file: judge0.conf
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  shared-tmp:
  shared-isolate:
