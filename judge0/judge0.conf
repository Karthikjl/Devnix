# ==============================================================================
# Judge0 Configuration File
# Documentation: https://ce.judge0.com/
# ==============================================================================

# Database settings
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0password
POSTGRES_DB=judge0
POSTGRES_HOST=db
POSTGRES_PORT=5432

# Redis settings
REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=redispassword

# Judge0 Server & Worker Settings
SERVER_PORT=2358
ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=true
ALLOWED_LANGUAGES_FOR_COMPILER_OPTIONS=

# Resource limits (Defaults & Max allowed for submissions)
CPU_TIME_LIMIT=5.0
MAX_CPU_TIME_LIMIT=15.0
CPU_EXTRA_TIME=1.0
MAX_CPU_EXTRA_TIME=5.0
WALL_TIME_LIMIT=10.0
MAX_WALL_TIME_LIMIT=30.0
MEMORY_LIMIT=128000
MAX_MEMORY_LIMIT=512000
STACK_LIMIT=64000
MAX_STACK_LIMIT=128000
MAX_PROCESSES_AND_OR_THREADS=60
MAX_MAX_PROCESSES_AND_OR_THREADS=120
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
MAX_FILE_SIZE=1024
MAX_MAX_FILE_SIZE=4096

# Authentication & Rate Limiting (leave blank if public / local dev)
# AUTH_TOKEN=your_secret_api_token
AUTH_TOKEN=
AUTH_TOKEN_HEADER=X-Auth-Token
AUTH_USER=
AUTH_PASSWORD=
AUTH_USER_HEADER=X-Auth-User
AUTH_PASSWORD_HEADER=X-Auth-Key

# Callback URL default
CALLBACK_URL=
