services:
  # 1. Devnix Web Studio (Next.js)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JUDGE0_URL=http://server:2358
      - DEVNIX_DB_PATH=/app/data/devnix.db
    volumes:
      - devnix-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - server
    restart: always

  # 2. Judge0 API Server
  server:
    image: judge0/judge0:latest
    platform: linux/amd64
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: always
    env_file: ./judge0/judge0.conf
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 3. Judge0 Execution Workers
  workers:
    image: judge0/judge0:latest
    platform: linux/amd64
    command: ["./scripts/workers"]
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
      - isolate-data:/var/local/lib/isolate:rw
    privileged: true
    restart: always
    env_file: ./judge0/judge0.conf
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. PostgreSQL Database
  db:
    image: postgres:13.0
    env_file: ./judge0/judge0.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. Redis Queue Store
  redis:
    image: redis:6.0
    command: ["sh", "-c", "docker-entrypoint.sh --requirepass $$REDIS_PASSWORD"]
    env_file: ./judge0/judge0.conf
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  devnix-data:
  postgres-data:
  redis-data: 
  isolate-data:
