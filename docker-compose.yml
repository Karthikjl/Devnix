services:
  # ============================================================================
  # 1. DEVNIX Next.js Web Frontend & API
  # ============================================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - JUDGE0_URL=http://server:2358
      - PORT=3000
    depends_on:
      - server
    restart: always

  # ============================================================================
  # 2. Judge0 Code Execution API Server
  # ============================================================================
  server:
    image: judge0/judge0:latest
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: always
    env_file: ./judge0/judge0.conf
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # 3. Judge0 Sandboxed Execution Workers
  # ============================================================================
  workers:
    image: judge0/judge0:latest
    command: ["./scripts/workers"]
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    privileged: true
    restart: always
    env_file: ./judge0/judge0.conf
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # 4. PostgreSQL Database
  # ============================================================================
  db:
    image: postgres:13.0
    env_file: ./judge0/judge0.conf
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 5. Redis Message Broker & Job Queue
  # ============================================================================
  redis:
    image: redis:6.0
    command: ["sh", "-c", "docker-entrypoint.sh --requirepass $$REDIS_PASSWORD"]
    env_file: ./judge0/judge0.conf
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
